id = "openidea.restful-toolkit"
name = "Restful Toolkit"
version = "0.3.5"
description = "Spring / JAX-RS / Kotlin route indexing in a text-only WASM sandbox: parse mappings from file text, join paths, publish endpoints."
authors = ["OpenIDEA contributors"]
license = "Apache-2.0"
change-notes = "0.3.5 — the index records a parser version; mismatched caches are discarded and rebuilt from scratch."
categories = ["tools"]
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
# The commands are declared below, so Find Action lists them before the code
# loads; the plugin activates on the first command run.
activation = ["on-command:*", "on-startup-finished", "on-view:restful-routes", "on-event:files-changed"]

# Only what every command needs is required; everything else can be refused
# one by one and the plugin degrades with a readable message (US-E6-03).
[capabilities]
required = ["project.read", "editor.read"]
optional = ["clipboard", "storage", "events", "net:localhost", "net.http:localhost"]

[[contributes.commands]]
id = "copy-full-url"
title = "Restful Toolkit: Copy Full URL"
category = "Restful Toolkit"

[[contributes.commands]]
id = "copy-query-param"
title = "Restful Toolkit: Copy Query Param"
category = "Restful Toolkit"

[[contributes.commands]]
id = "copy-request-body"
title = "Restful Toolkit: Copy RequestBody JSON"
category = "Restful Toolkit"

[[contributes.commands]]
id = "refresh-index"
title = "Restful Toolkit: Rebuild Route Index"
category = "Restful Toolkit"

[[contributes.commands]]
id = "search-routes"
title = "Restful Toolkit: Search Routes"
category = "Restful Toolkit"

[[contributes.commands]]
id = "send-request"
title = "Restful Toolkit: Send Request"
category = "Restful Toolkit"

[[contributes.commands]]
id = "convert-json"
title = "Restful Toolkit: Class to JSON"
category = "Restful Toolkit"

[[contributes.commands]]
id = "convert-json-compressed"
title = "Restful Toolkit: Class to Compressed JSON"
category = "Restful Toolkit"

[[contributes.commands]]
id = "convert-bulk-value"
title = "Restful Toolkit: Class to Bulk Value"
category = "Restful Toolkit"

# Tree-node commands: the right-click menu passes the node key as the argument.
[[contributes.commands]]
id = "copy-url"
title = "Restful Toolkit: Copy URL of Node"
category = "Restful Toolkit"

[[contributes.commands]]
id = "open-source"
title = "Restful Toolkit: Jump to Source"
category = "Restful Toolkit"

[[contributes.commands]]
id = "restful-pick"
title = "Restful Toolkit: Copy"
category = "Restful Toolkit"

[[contributes.commands]]
id = "goto-route"
title = "Restful Toolkit: Go to Route"
category = "Restful Toolkit"

[[contributes.commands]]
id = "test-parse"
title = "Restful Toolkit: Run Parse"
category = "Restful Toolkit"

[[contributes.commands]]
id = "copy-many-urls"
title = "Restful Toolkit: Copy URLs of Selected Routes"
category = "Restful Toolkit"

[contributes.settings]
title = "Restful Toolkit"

[[contributes.settings.pages]]
id = "main"
title = "Restful Toolkit"
schema = "settings.schema.json"

[[contributes.settings.pages.actions]]
title = "Test parse"
command = "test-parse"

# `detail = true` shows the last response beside the tree (Response / Headers).
[[contributes.views]]
id = "restful-routes"
title = "Restful Routes"
icon = "search"
location = "services"
detail = true

# The index covers both languages; the host calls `endpoints` after any of these
# files changes, and the plugin answers from its storage cache.
[[contributes.endpoints]]
files = ["**/*.java", "**/*.kt", "**/*.py"]

[[contributes.menus]]
menu = "editor.context"
command = "copy-full-url"
when = "editorLangId == java"

[[contributes.menus]]
menu = "editor.context"
command = "copy-query-param"
when = "editorLangId == java"

[[contributes.menus]]
menu = "editor.context"
command = "copy-request-body"
when = "editorLangId == java"

[[contributes.menus]]
menu = "editor.context"
command = "convert-json"
when = "editorLangId == java || editorLangId == kotlin"

[[contributes.menus]]
menu = "editor.context"
command = "convert-json-compressed"
when = "editorLangId == java || editorLangId == kotlin"

[[contributes.menus]]
menu = "editor.context"
command = "convert-bulk-value"
when = "editorLangId == java || editorLangId == kotlin"

[[contributes.menus]]
menu = "viewItem.context"
view = "restful-routes"
command = "copy-url"

[[contributes.menus]]
menu = "viewItem.context"
view = "restful-routes"
command = "open-source"

# The host's tree is single-select: this entry opens a pick-many dialog and
# copies the chosen URLs joined with a blank line (US-E3-04).
[[contributes.menus]]
menu = "viewItem.context"
view = "restful-routes"
command = "copy-many-urls"

[[contributes.keymaps]]
command = "copy-full-url"
key = "Ctrl+Alt+U"
mac = "Meta+Alt+U"

[[contributes.keymaps]]
command = "goto-route"
key = "Ctrl+Alt+N"
mac = "Meta+Alt+N"

# US-E3-04: one shortcut for the aggregate copy menu (Alt+Shift+R).
[[contributes.keymaps]]
command = "restful-pick"
key = "Alt+Shift+R"
mac = "Meta+Shift+R"

[[contributes.keymaps]]
command = "send-request"
key = "Ctrl+Alt+R"
mac = "Meta+Alt+R"

# Search Everywhere tab: URL fragments and full URLs both work (US-E2-04).
[[contributes.searchCategories]]
id = "routes"
title = "Routes"
